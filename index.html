<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AMBO預約表</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#e0d6cd]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ChevronLeft = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    );
    const ChevronRight = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    );

    function ReservationCalendar() {
      // 取得當前真實系統時間的年月作為起始點
      const now = new Date();
      const minAllowedDate = new Date(now.getFullYear(), now.getMonth(), 1);
      const maxAllowedDate = new Date(now.getFullYear(), now.getMonth() + 2, 1); // 最多看未來兩個月

      const [currentDate, setCurrentDate] = useState(minAllowedDate); 
      const [dayStatuses, setDayStatuses] = useState({});
      const [dayNotes, setDayNotes] = useState({}); // 儲存特殊備註
      const [noticeText, setNoticeText] = useState("🌿 歡迎來到 AMBO 工作室！\n\n1. 預約請透過右下角 LINE 聯繫。\n2. 預約保留 15 分鐘，若需改期請提前告知。\n3. 工作室地點：請洽詢官方 LINE。"); // 預約須知內容
      const [isReadOnly, setIsReadOnly] = useState(true); 
      const [syncStatus, setSyncStatus] = useState("連線中...");
      const [isSaving, setIsSaving] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [adminPassword, setAdminPassword] = useState("");

      // 備註彈窗狀態 (管理員編輯用)
      const [activeNoteModal, setActiveNoteModal] = useState(null); // dateKey
      const [tempNoteText, setTempNoteText] = useState("");

      // 提示氣泡狀態（點擊或hover顯示備註）
      const [activeTooltip, setActiveTooltip] = useState(null);

      // 預約須知彈窗狀態
      const [showNoticeModal, setShowNoticeModal] = useState(false);
      const [isEditingNotice, setIsEditingNotice] = useState(false);
      const [tempNoticeText, setTempNoticeText] = useState("");

      // 月份切換動態轉場效果狀態 (Smooth Fade-in & Flip)
      const [isAnimating, setIsAnimating] = useState(true);

      // 你的 Google 試算表網頁應用程式網址（已內建綁定）
      const scriptUrl = "https://script.google.com/macros/s/AKfycbwuJQ2zE-8YRxbZdxtVhgW02SJuhQwtYIVu-B73Ic46EwgJ4FcCCELafHT5RvxA-KiIbw/exec";

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
          setIsReadOnly(false); 
        }

        if (scriptUrl) {
          fetchDataFromSheets(scriptUrl);
          // 每 10 秒自動背景抓取最新狀態，實現跨裝置自動同步
          const interval = setInterval(() => {
            fetchDataFromSheets(scriptUrl);
          }, 10000);
          return () => clearInterval(interval);
        }
      }, []);

      const fetchDataFromSheets = async (url) => {
        if (!url) return;
        try {
          const res = await fetch(`${url}?t=${Date.now()}`);
          const text = await res.text();
          let data;
          try {
            data = JSON.parse(text);
          } catch(err) {
            return;
          }
          if (data) {
            if (data.statuses) setDayStatuses(data.statuses);
            if (data.notes) setDayNotes(data.notes);
            if (data.notice) setNoticeText(data.notice);
            setSyncStatus("✨已同步");
          } else {
            setSyncStatus("✨ 尚無排班資料");
          }
        } catch (e) {
          setSyncStatus("⚠️同步連線中");
        }
      };

      const canGoPrev = () => {
        const prevMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
        return prevMonth >= minAllowedDate;
      };

      const canGoNext = () => {
        const nextMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
        return nextMonth <= maxAllowedDate;
      };

      const handlePrevMonth = () => {
        const target = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
        if (target < minAllowedDate) return; 
        
        // 觸發絲滑日曆翻頁淡入淡出動畫
        setIsAnimating(false);
        setTimeout(() => {
          setCurrentDate(target);
          setIsAnimating(true);
        }, 150);
      };

      const handleNextMonth = () => {
        const target = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
        if (target > maxAllowedDate) return;
        
        // 觸發絲滑日曆翻頁淡入淡出動畫
        setIsAnimating(false);
        setTimeout(() => {
          setCurrentDate(target);
          setIsAnimating(true);
        }, 150);
      };

      const handleCellClick = (e, dateKey) => {
        e.stopPropagation();
        const hasNote = !!dayNotes[dateKey];

        if (isReadOnly) {
          if (hasNote) {
            setActiveTooltip(activeTooltip === dateKey ? null : dateKey);
          } else {
            setActiveTooltip(null);
          }
          return;
        }

        toggleDayStatus(dateKey);
      };

      const toggleDayStatus = (dateKey) => {
        if (isReadOnly) return;

        setDayStatuses(prev => {
          const currentStatus = prev[dateKey];
          let nextStatus = 'available';
          
          if (!currentStatus || currentStatus === 'available') nextStatus = 'full'; 
          else if (currentStatus === 'full') nextStatus = 'off'; 
          else nextStatus = 'available'; 
          
          return { ...prev, [dateKey]: nextStatus };
        });
      };

      const handleOpenNoteModal = (e, dateKey) => {
        e.stopPropagation(); 
        if (isReadOnly) {
          setActiveTooltip(activeTooltip === dateKey ? null : dateKey);
          return;
        }
        setActiveNoteModal(dateKey);
        setTempNoteText(dayNotes[dateKey] || "");
      };

      const handleSaveNote = () => {
        if (!activeNoteModal) return;
        const dateKey = activeNoteModal;
        setDayNotes(prev => {
          const updated = { ...prev };
          if (tempNoteText.trim() === "") {
            delete updated[dateKey];
          } else {
            updated[dateKey] = tempNoteText.trim();
          }
          return updated;
        });
        setActiveNoteModal(null);
        setTempNoteText("");
      };

      const handleSaveNotice = () => {
        setNoticeText(tempNoticeText);
        setIsEditingNotice(false);
      };

      const handleManualSave = async () => {
        if (isReadOnly) return;
        if (!scriptUrl) return;

        setIsSaving(true);
        setSyncStatus("⏳儲存中...");
        
        try {
          await fetch(scriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ statuses: dayStatuses, notes: dayNotes, notice: noticeText })
          });

          setIsSaving(false);
          setSyncStatus("🎉儲存成功！全網已同步");
          setTimeout(() => setSyncStatus("✨已同步"), 4000);
        } catch(err) {
          setIsSaving(false);
          setSyncStatus("⚠️儲存失敗，請檢查網路");
        }
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPassword === "1688" || adminPassword === "ambo888") {
          setIsReadOnly(false);
          setShowLoginModal(false);
          setAdminPassword("");
          window.history.replaceState({}, '', '?admin=true');
        } else {
          alert("密碼錯誤！請重新輸入。");
        }
      };

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      const firstDay = new Date(year, month, 1).getDay();
      const startingEmptySlots = firstDay === 0 ? 6 : firstDay - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-4 font-sans relative" style={{ 
          fontFamily: "'Quicksand', sans-serif",
          backgroundColor: "#e0d6cd", 
          backgroundImage: "radial-gradient(#bfaea2 1.5px, transparent 1.5px)", 
          backgroundSize: "16px 16px", 
          backgroundPosition: "calc(50% + 6px) center" 
        }} onClick={() => setActiveTooltip(null)}>
          
          {/* 上方導覽列（簡潔美觀，僅保留左右切換月份） */}
          <div className="w-full max-w-[400px] h-[44px] mb-[24px] bg-[#F8F6F2] rounded-full flex justify-between items-center px-3 relative z-20 shadow-sm">
            <div className="absolute -bottom-[5px] left-1/2 -translate-x-1/2 w-3.5 h-3.5 bg-[#F8F6F2] rotate-45 rounded-[2px]"></div>
            
            <button 
              onClick={handlePrevMonth} 
              disabled={!canGoPrev()}
              className={`p-1 rounded-full transition-all shrink-0 ${
                !canGoPrev() ? 'opacity-30 cursor-not-allowed text-[#CDBEAD]' : 'hover:bg-[#e0d6cd] text-[#CDBEAD] active:scale-90'
              }`}
            >
              <ChevronLeft />
            </button>

            <div className="flex-1 text-center text-[11px] font-bold tracking-widest text-[#A89B90] truncate px-1">
  {isReadOnly ? `✦ 可左右切換月份 (${syncStatus}) ✦` : `✦ 管理員編輯模式 (${syncStatus}) ✦`}
            </div>

            <button 
              onClick={handleNextMonth} 
              disabled={!canGoNext()}
              className={`p-1 rounded-full transition-all shrink-0 ${
                !canGoNext() ? 'opacity-30 cursor-not-allowed text-[#CDBEAD]' : 'hover:bg-[#e0d6cd] text-[#CDBEAD] active:scale-90'
              }`}
            >
              <ChevronRight />
            </button>
          </div>

          {/* 日曆卡片主體 (結合 Smooth Fade-in & Flip 動態效果) */}
          <div className={`w-full max-w-[400px] relative bg-[#F8F6F2]/70 shadow-md rounded-[2rem] overflow-hidden px-6 pt-5 pb-5 flex flex-col transition-all duration-300 transform ${
            isAnimating ? 'opacity-100 scale-100 translate-y-0' : 'opacity-0 scale-95 translate-y-2'
          }`}>
            
            <div className="absolute top-[6px] left-1/2 -translate-x-1/2 text-[8px] font-medium tracking-[0.15em] text-[#A89B90] pointer-events-none">
              ▪︎AMBO.ART▪︎
            </div>

            <svg className="absolute top-5 left-5 w-5 h-5 text-[#CDBEAD]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
              <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" strokeLinejoin="round"/>
            </svg>

            <svg className="absolute top-[18px] right-[18px] w-[28px] h-[28px] text-[#CDBEAD]" viewBox="0 0 28 28" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
              <g transform="translate(0, 6) scale(0.85)">
                <path d="M12 6.5C13.5 3 18 4.5 17.5 8C21.5 8.5 21.5 14 18 15C19 19 14.5 21.5 12 18.5C9.5 21.5 5 19 6 15C2.5 14 2.5 8.5 6.5 8C6 4.5 10.5 3 12 6.5Z"/>
                <circle cx="12" cy="12.5" r="1.5"/>
              </g>
              <g transform="translate(15, 0) scale(0.55)">
                <path fill="currentColor" stroke="none" d="M12 6.5C13.5 3 18 4.5 17.5 8C21.5 8.5 21.5 14 18 15C19 19 14.5 21.5 12 18.5C9.5 21.5 5 19 6 15C2.5 14 2.5 8.5 6.5 8C6 4.5 10.5 3 12 6.5Z"/>
                <circle cx="12" cy="12.5" r="1.5" fill="#F8F6F2" stroke="none" />
              </g>
            </svg>

            <div className="text-center mb-2 mt-0">
              <div className="flex items-baseline justify-center gap-3">
                <h1 className="text-[2.6rem] text-[#5D4B41] leading-none font-bold" style={{ fontFamily: "'Dancing Script', cursive" }}>
                  {monthNames[month]}
                </h1>
                <span className="text-[14px] tracking-[0.15em] text-[#A89B90] font-bold mb-1">
                  {(month + 1).toString().padStart(2, '0')} / {year}
                </span>
              </div>
              <div className="flex justify-center -mt-1.5">
                 <svg width="85" height="12" viewBox="0 0 120 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                   <path d="M6 9 C 40 18, 85 16, 114 4" stroke="#e0d6cd" strokeWidth="2.5" strokeLinecap="round"/>
                 </svg>
              </div>
            </div>

            <div className="grid grid-cols-7 gap-1 text-center text-[13px] font-bold tracking-widest text-[#A89B90] mb-2">
              <div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div>
              <div className="text-[#D58C92]">SAT</div><div className="text-[#D58C92]">SUN</div>
            </div>
            
            <div className="border-b-[1.5px] border-[#e0d6cd]/70 mb-2"></div>

            <div className="grid grid-cols-7 gap-y-1.5 gap-x-1 flex-grow content-start">
              {Array.from({ length: startingEmptySlots }).map((_, index) => (
                <div key={`empty-${index}`} className="h-[34px]"></div>
              ))}
              
              {Array.from({ length: daysInMonth }).map((_, index) => {
                const day = index + 1;
                const dateKey = `${year}-${month + 1}-${day}`;
                const status = dayStatuses[dateKey] || 'available';
                const note = dayNotes[dateKey];
                
                const isToday = day === now.getDate() && month === now.getMonth() && year === now.getFullYear();
                
                return (
                  <div 
                    key={dateKey} 
                    onClick={(e) => handleCellClick(e, dateKey)}
                    onMouseEnter={() => { if(note && isReadOnly) setActiveTooltip(dateKey); }}
                    className={`flex flex-col items-center justify-center group h-[34px] relative ${isReadOnly ? 'cursor-default' : 'cursor-pointer'}`}
                  >
                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                      {status === 'available' && (
                        <div className="w-[28px] h-[28px] border-[1.5px] border-dashed border-[#CDBEAD] rounded-full transition-all duration-300"></div>
                      )}
                      {status === 'off' && (
                        <div className="w-[28px] h-[28px] bg-[#E29A9F] transition-all duration-300 scale-105" 
                             style={{ borderRadius: "55% 45% 35% 65% / 45% 55% 45% 55%", transform: "rotate(-2deg)" }}></div>
                      )}
                      {status === 'full' && (
                        <div className="w-[28px] h-[28px] bg-[#9BB1CC] transition-all duration-300 scale-105"
                             style={{ borderRadius: "43% 57% 65% 35% / 55% 45% 55% 45%", transform: "rotate(3deg)" }}></div>
                      )}
                    </div>

                    <span className={`text-[13px] font-bold z-10 transition-colors relative ${
                      status === 'off' || status === 'full' ? 'text-white' : 'text-[#5D4B41]'
                    }`}>
                      {day}
                      {isToday && (
                        <span className="absolute -top-1.5 -right-2.5 text-[11px] text-[#F9F1D0] font-bold select-none pointer-events-none" style={{ textShadow: "-0.5px -0.5px 0 rgba(140,122,107,0.4), 0.5px -0.5px 0 rgba(140,122,107,0.4), -0.5px 0.5px 0 rgba(140,122,107,0.4), 0.5px 0.5px 0 rgba(140,122,107,0.4)" }}>✦</span>
                      )}
                      {isToday && (
                        <span className="absolute -bottom-1 -left-2.5 text-[10px] text-[#F9F1D0] font-bold select-none pointer-events-none" style={{ textShadow: "-0.5px -0.5px 0 rgba(140,122,107,0.4), 0.5px -0.5px 0 rgba(140,122,107,0.4), -0.5px 0.5px 0 rgba(140,122,107,0.4), 0.5px 0.5px 0 rgba(140,122,107,0.4)" }}>✦</span>
                      )}
                    </span>

                    {note && (
                      <div 
                        onClick={(e) => handleOpenNoteModal(e, dateKey)}
                        className="absolute top-0 right-0 w-4 h-4 bg-[#C97B7E] rounded-full flex items-center justify-center z-30 cursor-pointer shadow-sm hover:scale-110 transition-transform"
                        title={note}
                      >
                        <span className="text-[10px] text-[#F9F1D0] font-bold leading-none">!</span>
                      </div>
                    )}

                    {!isReadOnly && !note && (
                      <div 
                        onClick={(e) => handleOpenNoteModal(e, dateKey)}
                        className="absolute top-0 right-0 w-3.5 h-3.5 bg-black/10 hover:bg-[#C97B7E] rounded-full flex items-center justify-center z-30 opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer"
                        title="新增備註"
                      >
                        <span className="text-[9px] text-white font-bold">+</span>
                      </div>
                    )}

                    {activeTooltip === dateKey && note && (
                      <div className="absolute bottom-full mb-1 left-1/2 -translate-x-1/2 bg-[#5D4B41] text-[#F8F6F2] text-[11px] px-3 py-1.5 rounded-xl shadow-lg z-50 whitespace-nowrap pointer-events-none">
                        {note}
                        <div className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-[#5D4B41]"></div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* 底部圖例說明區 */}
            <div className="mt-4 pt-3 relative">
              <div className="absolute top-0 left-2 right-2 border-t-[1.5px] border-dashed border-[#e0d6cd]/80"></div>
              <div className="flex justify-center gap-3.5 items-center pt-1">
                <div className="flex items-center gap-1">
                  <div className="w-[14px] h-[14px] border-[1.5px] border-dashed border-[#CDBEAD] rounded-full"></div>
                  <span className="text-[11px] font-bold text-[#5D4B41]">尚有空位</span>
                </div>
                <div className="flex items-center gap-1">
                  <div className="w-[14px] h-[14px] bg-[#9BB1CC]" style={{ borderRadius: "43% 57% 65% 35% / 55% 45% 55% 45%" }}></div>
                  <span className="text-[11px] font-bold text-[#5D4B41]">額滿</span>
                </div>
                <div className="flex items-center gap-1">
                  <div className="w-[14px] h-[14px] bg-[#E29A9F]" style={{ borderRadius: "55% 45% 35% 65% / 45% 55% 45% 55%" }}></div>
                  <span className="text-[11px] font-bold text-[#5D4B41]">休假</span>
                </div>
                <div className="flex items-center gap-1">
                  <div className="w-[15px] h-[15px] bg-[#C97B7E] rounded-full flex items-center justify-center">
                    <span className="text-[10px] text-[#F9F1D0] font-bold leading-none">!</span>
                  </div>
                  <span className="text-[11px] font-bold text-[#5D4B41]">特殊備註(可點擊)</span>
                </div>
              </div>
            </div>
            
          </div>

          {/* 管理員儲存按鈕 */}
          {!isReadOnly && (
            <div className="mt-4 w-full max-w-[400px] flex flex-col gap-2">
              <button 
                onClick={handleManualSave}
                disabled={isSaving}
                className={`w-full py-3.5 font-bold rounded-2xl shadow-md transition-all active:scale-95 tracking-widest flex items-center justify-center gap-2 text-[15px] ${
                  syncStatus.includes("成功") 
                    ? 'bg-emerald-600 text-white' 
                    : 'bg-[#5D4B41] hover:bg-[#4a3b33] text-[#F8F6F2]'
                }`}
              >
                <span>{syncStatus.includes("成功") ? "🎉儲存成功！全網已同步" : "💾立即儲存並同步至 Google 試算表"}</span>
              </button>
            </div>
          )}

          {isReadOnly && (
            <div className="mt-4 px-4 py-2 bg-[#F8F6F2]/50 hover:bg-[#F8F6F2] rounded-full text-[#A89B90] hover:text-[#5D4B41] text-[11px] font-bold tracking-widest transition-all cursor-pointer shadow-sm"
                 onClick={() => setShowLoginModal(true)}>
              ✦ 訪客瀏覽模式 (點此登入管理員) ✦
            </div>
          )}

          {/* 右下角固定浮動按鈕區：上方為預約須知（溫暖黃調焦糖色+奶白圖標），下方為 LINE 快速預約 */}
          <div className="fixed bottom-5 right-5 sm:right-[calc(50%-200px+20px)] flex flex-col gap-2.5 z-40">
            {/* 預約須知按鈕（黃調實心焦糖色 #8E7456，奶白手繪資訊圖標） */}
            <button 
              onClick={() => setShowNoticeModal(true)}
              className="w-[46px] h-[46px] bg-[#8E7456] hover:bg-[#7d6449] text-[#F9F1D0] rounded-full shadow-lg flex items-center justify-center transition-all hover:scale-105 active:scale-95 group relative font-bold"
              title="預約須知"
            >
              <svg className="w-6 h-6 text-[#F9F1D0]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="9" strokeWidth="2"/>
                <line x1="12" y1="11" x2="12" y2="16"/>
                <line x1="12" y1="8" x2="12.01" y2="8"/>
              </svg>
              <span className="absolute right-full mr-2.5 px-2.5 py-1 bg-[#5D4B41] text-[#F8F6F2] text-[11px] rounded-xl whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none shadow-md">
                預約須知🥨
              </span>
            </button>

            {/* LINE 快速預約按鈕 */}
            <a 
              href="https://lin.ee/wzabvly" 
              target="_blank" 
              rel="noopener noreferrer"
              className="w-[46px] h-[46px] bg-[#5D4B41] hover:bg-[#4a3b33] text-[#F8F6F2] rounded-full shadow-lg flex items-center justify-center transition-all hover:scale-105 active:scale-95 group relative font-bold text-[13px] tracking-tight"
              title="LINE 快速預約"
            >
              <span>LINE</span>
              <span className="absolute right-full mr-2.5 px-2.5 py-1 bg-[#5D4B41] text-[#F8F6F2] text-[11px] rounded-xl whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none shadow-md">
                LINE 快速預約💬
              </span>
            </a>
          </div>

          {/* 預約須知彈窗 (支援捲軸、奶白大框、compact標題) */}
          {showNoticeModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={() => setShowNoticeModal(false)}>
              <div className="bg-[#F8F6F2] rounded-3xl p-5 w-full max-w-[340px] shadow-xl flex flex-col items-center" onClick={(e) => e.stopPropagation()}>
                <h3 className="text-[16px] font-bold text-[#5D4B41] mb-2">✦ 預約須知 ✦</h3>
                
                {!isEditingNotice ? (
                  <>
                    <div className="w-full bg-white px-4 py-3 rounded-2xl border border-[#CDBEAD]/50 text-[13px] text-[#5D4B41] whitespace-pre-line leading-relaxed mb-4 max-h-[320px] min-h-[180px] overflow-y-auto shadow-inner">
                      {noticeText}
                    </div>
                    
                    <div className="flex gap-2 w-full">
                      {!isReadOnly && (
                        <button 
                          type="button" 
                          onClick={() => {
                            setIsEditingNotice(true);
                            setTempNoticeText(noticeText);
                          }}
                          className="flex-1 py-2.5 bg-[#CDBEAD] hover:bg-[#bcad9c] text-[#5D4B41] font-bold rounded-xl text-[14px]"
                        >
                          編輯須知
                        </button>
                      )}
                      <button 
                        type="button" 
                        onClick={() => setShowNoticeModal(false)}
                        className="flex-1 py-2.5 bg-[#5D4B41] text-white font-bold rounded-xl text-[14px] shadow"
                      >
                        關閉視窗
                      </button>
                    </div>
                  </>
                ) : (
                  <>
                    <textarea 
                      rows="8"
                      value={tempNoticeText}
                      onChange={(e) => setTempNoticeText(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-xl border border-[#CDBEAD] bg-white text-[#5D4B41] text-[13px] outline-none resize-none mb-3 max-h-[320px] min-h-[180px] overflow-y-auto shadow-inner"
                      placeholder="請輸入預約須知內容..."
                    />
                    <div className="flex gap-2 w-full">
                      <button 
                        type="button" 
                        onClick={() => setIsEditingNotice(false)}
                        className="flex-1 py-2.5 bg-gray-200 text-[#5D4B41] font-bold rounded-xl text-[14px]"
                      >
                        取消
                      </button>
                      <button 
                        type="button" 
                        onClick={handleSaveNotice}
                        className="flex-1 py-2.5 bg-[#5D4B41] text-white font-bold rounded-xl text-[14px] shadow"
                      >
                        確認修改
                      </button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

          {/* 管理員編輯備註彈窗 */}
          {activeNoteModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
              <div className="bg-[#F8F6F2] rounded-3xl p-6 w-full max-w-[320px] shadow-xl flex flex-col items-center">
                <h3 className="text-[16px] font-bold text-[#5D4B41] mb-1">✏️編輯 {activeNoteModal} 備註</h3>
                <p className="text-[11px] text-[#A89B90] mb-4 text-center">輸入特殊說明（如：過年營業至初三、僅半天營業）</p>
                <textarea 
                  rows="3"
                  placeholder="請輸入特殊備註 (若留空則清除)" 
                  value={tempNoteText}
                  onChange={(e) => setTempNoteText(e.target.value)}
                  autoFocus
                  className="w-full px-3 py-2.5 rounded-xl border border-[#CDBEAD] bg-white text-[#5D4B41] text-[13px] outline-none resize-none mb-3"
                />
                <div className="flex gap-2 w-full">
                  <button 
                    type="button" 
                    onClick={() => setActiveNoteModal(null)}
                    className="flex-1 py-2 bg-gray-200 text-[#5D4B41] font-bold rounded-xl text-[13px]"
                  >
                    取消
                  </button>
                  <button 
                    type="button" 
                    onClick={handleSaveNote}
                    className="flex-1 py-2 bg-[#5D4B41] text-white font-bold rounded-xl text-[13px] shadow"
                  >
                    儲存備註
                  </button>
                </div>
              </div>
            </div>
          )}

          {showLoginModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-[#F8F6F2] rounded-3xl p-6 w-full max-w-[320px] shadow-xl flex flex-col items-center">
                <h3 className="text-[18px] font-bold text-[#5D4B41] mb-2">🔐 管理員登入</h3>
                <p className="text-[12px] text-[#A89B90] mb-4 text-center">請輸入管理員解鎖密碼</p>
                <form onSubmit={handleAdminLogin} className="w-full flex flex-col gap-3">
                  <input 
                    type="password" 
                    placeholder="請輸入密碼" 
                    value={adminPassword}
                    onChange={(e) => setAdminPassword(e.target.value)}
                    autoFocus
                    className="w-full px-4 py-2.5 rounded-xl border border-[#CDBEAD] bg-white text-[#5D4B41] text-center tracking-widest outline-none"
                  />
                  <div className="flex gap-2 mt-2">
                    <button 
                      type="button" 
                      onClick={() => setShowLoginModal(false)}
                      className="flex-1 py-2.5 bg-gray-200 text-[#5D4B41] font-bold rounded-xl text-[14px]"
                    >
                      取消
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 py-2.5 bg-[#5D4B41] text-white font-bold rounded-xl text-[14px] shadow"
                    >
                      確認解鎖
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ReservationCalendar />);
  </script>
</body>
</html>
