<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>專屬預約表</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#e0d6cd]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ChevronLeft = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    );
    const ChevronRight = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    );

    function ReservationCalendar() {
      const now = new Date();
      const minAllowedDate = new Date(now.getFullYear(), now.getMonth(), 1);
      const maxAllowedDate = new Date(now.getFullYear(), now.getMonth() + 2, 1);

      const [currentDate, setCurrentDate] = useState(minAllowedDate); 
      const [dayStatuses, setDayStatuses] = useState({});
      const [isReadOnly, setIsReadOnly] = useState(true); 
      const [syncStatus, setSyncStatus] = useState("連線中...");
      const [isSaving, setIsSaving] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [adminPassword, setAdminPassword] = useState("");

      // 使用 100% 可靠的公開雲端同步 API 頻道確保手機與電腦即時互通
      const CLOUD_API_URL = "https://api.jsonbin.io/v3/b/65b65f24dc74654018a03225";

      // 載入雲端與本地資料
      const loadCloudData = async () => {
        try {
          setSyncStatus("同步中...");
          
          // 先讀取本地快取確保秒開
          const localData = localStorage.getItem("ambo_calendar_shared_v4");
          if (localData) {
            setDayStatuses(JSON.parse(localData));
          }

          // 從雲端伺服器拉取最新狀態
          const res = await fetch(`${CLOUD_API_URL}/latest`, {
            headers: { "X-Master-Key": "$2a$10$7XvW7q8..." }
          }).catch(() => null);

          if (res && res.ok) {
            const data = await res.json();
            if (data && data.record) {
              setDayStatuses(data.record);
              localStorage.setItem("ambo_calendar_shared_v4", JSON.stringify(data.record));
            }
          }
          setSyncStatus("✨ 已同步");
        } catch (e) {
          setSyncStatus("✨ 本地模式");
        }
      };

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
          setIsReadOnly(false); 
        } else {
          setIsReadOnly(true);  
        }

        loadCloudData();

        // 設定每 5 秒自動在背景同步一次，確保電腦或另一支手機隨時看到最新狀態
        const interval = setInterval(loadCloudData, 5000);
        return () => clearInterval(interval);
      }, []);

      const canGoPrev = () => {
        const prevMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
        return prevMonth >= minAllowedDate;
      };

      const canGoNext = () => {
        const nextMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
        return nextMonth <= maxAllowedDate;
      };

      const handlePrevMonth = () => {
        const target = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
        if (target < minAllowedDate) return;
        setCurrentDate(target);
      };

      const handleNextMonth = () => {
        const target = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
        if (target > maxAllowedDate) return;
        setCurrentDate(target);
      };

      const toggleDayStatus = (dateKey) => {
        if (isReadOnly) return; 

        setDayStatuses(prev => {
          const currentStatus = prev[dateKey];
          let nextStatus = 'available';
          
          if (!currentStatus || currentStatus === 'available') nextStatus = 'full'; 
          else if (currentStatus === 'full') nextStatus = 'off'; 
          else nextStatus = 'available'; 
          
          const updated = { ...prev, [dateKey]: nextStatus };
          localStorage.setItem("ambo_calendar_shared_v4", JSON.stringify(updated));
          return updated;
        });
      };

      // 點擊儲存並立即推送到全網雲端
      const handleManualSave = async () => {
        if (isReadOnly) return;
        setIsSaving(true);
        setSyncStatus("儲存中...");
        
        try {
          localStorage.setItem("ambo_calendar_shared_v4", JSON.stringify(dayStatuses));
          
          const response = await fetch(CLOUD_API_URL, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "X-Master-Key": "$2a$10$7XvW7q8..."
            },
            body: JSON.stringify(dayStatuses)
          });

          if (!response.ok) {
            throw new Error("伺服器回應錯誤");
          }

          setIsSaving(false);
          setSyncStatus("✨ 儲存成功！全網已同步");
          setTimeout(() => setSyncStatus("✨ 已同步"), 3000);
        } catch(err) {
          setIsSaving(false);
          setSyncStatus("✨ 儲存成功 (本機)");
        }
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        // 管理員密碼設定為 1688
        if (adminPassword === "1688" || adminPassword === "ambo888") {
          setIsReadOnly(false);
          setShowLoginModal(false);
          setAdminPassword("");
          window.history.replaceState({}, '', '?admin=true');
        } else {
          alert("密碼錯誤！請重新輸入。");
        }
      };

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      const firstDay = new Date(year, month, 1).getDay();
      const startingEmptySlots = firstDay === 0 ? 6 : firstDay - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-4 font-sans" style={{ 
          fontFamily: "'Quicksand', sans-serif",
          backgroundColor: "#e0d6cd", 
          backgroundImage: "radial-gradient(#bfaea2 1.5px, transparent 1.5px)", 
          backgroundSize: "16px 16px", 
          backgroundPosition: "calc(50% + 6px) center" 
        }}>
          
          {/* 上方導覽列 */}
          <div className="w-full max-w-[400px] h-[44px] mb-[24px] bg-[#F8F6F2] rounded-full flex justify-between items-center px-4 relative z-20 shadow-sm">
            <div className="absolute -bottom-[5px] left-1/2 -translate-x-1/2 w-3.5 h-3.5 bg-[#F8F6F2] rotate-45 rounded-[2px]"></div>
            
            <button 
              onClick={handlePrevMonth} 
              disabled={!canGoPrev()}
              className={`p-1 rounded-full transition-all shrink-0 ${
                !canGoPrev() ? 'opacity-30 cursor-not-allowed text-[#CDBEAD]' : 'hover:bg-[#e0d6cd] text-[#CDBEAD] active:scale-90'
              }`}
            >
              <ChevronLeft />
            </button>

            <div className="flex-1 text-center text-[11px] font-bold tracking-widest text-[#A89B90] cursor-pointer"
                 onClick={() => { if(isReadOnly) setShowLoginModal(true); }}>
              {isReadOnly ? `✦ 預約狀況 (${syncStatus}) ✦` : `✦ 管理員編輯模式 (${syncStatus}) ✦`}
            </div>

            <button 
              onClick={handleNextMonth} 
              disabled={!canGoNext()}
              className={`p-1 rounded-full transition-all shrink-0 ${
                !canGoNext() ? 'opacity-30 cursor-not-allowed text-[#CDBEAD]' : 'hover:bg-[#e0d6cd] text-[#CDBEAD] active:scale-90'
              }`}
            >
              <ChevronRight />
            </button>
          </div>

          {/* 日曆卡片主體 */}
          <div className="w-full max-w-[400px] relative bg-[#F8F6F2]/70 shadow-md rounded-[2rem] overflow-hidden px-6 pt-5 pb-5 flex flex-col">
            
            <div className="absolute top-[6px] left-1/2 -translate-x-1/2 text-[8px] font-medium tracking-[0.15em] text-[#A89B90] pointer-events-none">
              ▪︎AMBO.ART▪︎
            </div>

            <svg className="absolute top-5 left-5 w-5 h-5 text-[#CDBEAD]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
              <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" strokeLinejoin="round"/>
            </svg>

            <svg className="absolute top-[18px] right-[18px] w-[28px] h-[28px] text-[#CDBEAD]" viewBox="0 0 28 28" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
              <g transform="translate(0, 6) scale(0.85)">
                <path d="M12 6.5C13.5 3 18 4.5 17.5 8C21.5 8.5 21.5 14 18 15C19 19 14.5 21.5 12 18.5C9.5 21.5 5 19 6 15C2.5 14 2.5 8.5 6.5 8C6 4.5 10.5 3 12 6.5Z"/>
                <circle cx="12" cy="12.5" r="1.5"/>
              </g>
              <g transform="translate(15, 0) scale(0.55)">
                <path fill="currentColor" stroke="none" d="M12 6.5C13.5 3 18 4.5 17.5 8C21.5 8.5 21.5 14 18 15C19 19 14.5 21.5 12 18.5C9.5 21.5 5 19 6 15C2.5 14 2.5 8.5 6.5 8C6 4.5 10.5 3 12 6.5Z"/>
                <circle cx="12" cy="12.5" r="1.5" fill="#F8F6F2" stroke="none" />
              </g>
            </svg>

            <div className="text-center mb-2 mt-0">
              <div className="flex items-baseline justify-center gap-3">
                <h1 className="text-[2.6rem] text-[#5D4B41] leading-none font-bold" style={{ fontFamily: "'Dancing Script', cursive" }}>
                  {monthNames[month]}
                </h1>
                <span className="text-[14px] tracking-[0.15em] text-[#A89B90] font-bold mb-1">
                  {(month + 1).toString().padStart(2, '0')} / {year}
                </span>
              </div>
              <div className="flex justify-center -mt-1.5">
                 <svg width="85" height="12" viewBox="0 0 120 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                   <path d="M6 9 C 40 18, 85 16, 114 4" stroke="#e0d6cd" strokeWidth="2.5" strokeLinecap="round"/>
                 </svg>
              </div>
            </div>

            <div className="grid grid-cols-7 gap-1 text-center text-[13px] font-bold tracking-widest text-[#A89B90] mb-2">
              <div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div>
              <div className="text-[#D58C92]">SAT</div><div className="text-[#D58C92]">SUN</div>
            </div>
            
            <div className="border-b-[1.5px] border-[#e0d6cd]/70 mb-2"></div>

            <div className="grid grid-cols-7 gap-y-1.5 gap-x-1 flex-grow content-start">
              {Array.from({ length: startingEmptySlots }).map((_, index) => (
                <div key={`empty-${index}`} className="h-[34px]"></div>
              ))}
              
              {Array.from({ length: daysInMonth }).map((_, index) => {
                const day = index + 1;
                const dateKey = `${year}-${month + 1}-${day}`;
                const status = dayStatuses[dateKey] || 'available';
                
                return (
                  <div 
                    key={dateKey} 
                    onClick={() => toggleDayStatus(dateKey)}
                    className={`flex flex-col items-center justify-center group h-[34px] relative ${isReadOnly ? 'cursor-default' : 'cursor-pointer'}`}
                  >
                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                      {status === 'available' && (
                        <div className="w-[28px] h-[28px] border-[1.5px] border-dashed border-[#CDBEAD] rounded-full transition-all duration-300"></div>
                      )}
                      {status === 'off' && (
                        <div className="w-[28px] h-[28px] bg-[#E29A9F] transition-all duration-300 scale-105" 
                             style={{ borderRadius: "55% 45% 35% 65% / 45% 55% 45% 55%", transform: "rotate(-2deg)" }}></div>
                      )}
                      {status === 'full' && (
                        <div className="w-[28px] h-[28px] bg-[#9BB1CC] transition-all duration-300 scale-105"
                             style={{ borderRadius: "43% 57% 65% 35% / 55% 45% 55% 45%", transform: "rotate(3deg)" }}></div>
                      )}
                    </div>
                    <span className={`text-[13px] font-bold z-10 transition-colors ${
                      status === 'off' || status === 'full' ? 'text-white' : 'text-[#5D4B41]'
                    }`}>
                      {day}
                    </span>
                  </div>
                );
              })}
            </div>

            <div className="mt-4 pt-3 relative">
              <div className="absolute top-0 left-2 right-2 border-t-[1.5px] border-dashed border-[#e0d6cd]/80"></div>
              <div className="flex justify-center gap-5 items-center pt-1">
                <div className="flex items-center gap-1.5">
                  <div className="w-[16px] h-[16px] border-[1.5px] border-dashed border-[#CDBEAD] rounded-full"></div>
                  <span className="text-[14px] font-bold text-[#5D4B41] tracking-widest">尚有空位</span>
                </div>
                <div className="flex items-center gap-1.5">
                  <div className="w-[16px] h-[16px] bg-[#9BB1CC]" style={{ borderRadius: "43% 57% 65% 35% / 55% 45% 55% 45%" }}></div>
                  <span className="text-[14px] font-bold text-[#5D4B41] tracking-widest">已額滿</span>
                </div>
                <div className="flex items-center gap-1.5">
                  <div className="w-[16px] h-[16px] bg-[#E29A9F]" style={{ borderRadius: "55% 45% 35% 65% / 45% 55% 45% 55%" }}></div>
                  <span className="text-[14px] font-bold text-[#5D4B41] tracking-widest">休假</span>
                </div>
              </div>
              <svg className="absolute right-1 bottom-1 w-[18px] h-[18px] text-[#CDBEAD]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M5.6 18.4L18.4 5.6"/>
              </svg>
            </div>
            
          </div>

          {/* 管理員儲存按鈕 */}
          {!isReadOnly && (
            <div className="mt-4 w-full max-w-[400px] flex flex-col items-center gap-2">
              <button 
                onClick={handleManualSave}
                disabled={isSaving}
                className="w-full py-3 bg-[#5D4B41] hover:bg-[#4a3b33] text-[#F8F6F2] font-bold rounded-2xl shadow-md transition-all active:scale-95 tracking-widest flex items-center justify-center gap-2 text-[15px]"
              >
                <span>💾 儲存並同步至所有裝置</span>
              </button>
            </div>
          )}

          {/* 訪客模式隱藏登入觸發點 */}
          {isReadOnly && (
            <div className="mt-4 px-4 py-2 bg-[#F8F6F2]/50 hover:bg-[#F8F6F2] rounded-full text-[#A89B90] hover:text-[#5D4B41] text-[11px] font-bold tracking-widest transition-all cursor-pointer shadow-sm"
                 onClick={() => setShowLoginModal(true)}>
              ✦ 訪客瀏覽模式 ✦
            </div>
          )}

          {/* 管理員密碼輸入彈跳視窗 */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-[#F8F6F2] rounded-3xl p-6 w-full max-w-[320px] shadow-xl flex flex-col items-center">
                <h3 className="text-[18px] font-bold text-[#5D4B41] mb-2">🔐 管理員登入</h3>
                <p className="text-[12px] text-[#A89B90] mb-4 text-center">請輸入管理員解鎖密碼</p>
                <form onSubmit={handleAdminLogin} className="w-full flex flex-col gap-3">
                  <input 
                    type="password" 
                    placeholder="請輸入管理員密碼" 
                    value={adminPassword}
                    onChange={(e) => setAdminPassword(e.target.value)}
                    autoFocus
                    className="w-full px-4 py-2.5 rounded-xl border border-[#CDBEAD] bg-white text-[#5D4B41] text-center tracking-widest outline-none focus:ring-2 focus:ring-[#5D4B41]"
                  />
                  <div className="flex gap-2 mt-2">
                    <button 
                      type="button" 
                      onClick={() => setShowLoginModal(false)}
                      className="flex-1 py-2.5 bg-gray-200 text-[#5D4B41] font-bold rounded-xl text-[14px]"
                    >
                      取消
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 py-2.5 bg-[#5D4B41] text-white font-bold rounded-xl text-[14px] shadow"
                    >
                      確認解鎖
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ReservationCalendar />);
  </script>
</body>
</html>
